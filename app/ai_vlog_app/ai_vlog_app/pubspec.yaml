name: ai_vlog
description: "AI Vlog —— 接收设备生成的 Vlog，管理、播放、保存到相册。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 网络：WiFi 按 IP 从设备拉取 Vlog
  dio: ^5.7.0

  # 本地路径
  path_provider: ^2.1.4
  path: ^1.9.0

  # 本地记录存储
  shared_preferences: ^2.3.2

  # 视频播放
  video_player: ^2.9.1

  # 保存到系统相册
  gal: ^2.3.0

  # 手动导入本地 mp4（接收过渡方案）
  file_picker: ^8.1.2

  # 工具
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
